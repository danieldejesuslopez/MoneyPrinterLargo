<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain · red en vivo</title>
<style>
  :root {
    --bg: #080b10;
    --panel: #0e131b;
    --panel-2: #131a24;
    --line: #1e2836;
    --ink: #e6edf6;
    --ink-dim: #8b9bb0;
    --ink-faint: #5a6b80;
    --pos: #22d3ee;
    --neg: #fb923c;
    --accent: #7dd3fc;
    --ok: #4ade80;
    --warn: #fbbf24;

    --g-text: #a78bfa;
    --g-script: #34d399;
    --g-plan: #fbbf24;
    --g-temporal: #f472b6;
    --g-channel: #60a5fa;
    --g-thumbnail: #f87171;
    --g-rule: #94a3b8;
    --g-head: #22d3ee;
    --g-blend: #7dd3fc;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace; }

  /* ---------- shell ---------- */

  #app {
    display: grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: 258px 1fr 286px;
    grid-template-areas: "head head head" "side stage insp";
    height: 100%;
  }

  header {
    grid-area: head;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 10px 16px;
    background: linear-gradient(180deg, #0d1219, #0a0e14);
    border-bottom: 1px solid var(--line);
  }

  .brand { font-weight: 650; letter-spacing: .14em; font-size: 12px; }
  .brand span { color: var(--accent); }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .chip {
    padding: 3px 9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    color: var(--ink-dim);
    font-size: 11px;
    white-space: nowrap;
  }
  .chip b { color: var(--ink); font-weight: 600; }
  .chip.good { border-color: #1e4a35; color: var(--ok); }
  .chip.warn { border-color: #4a3a1e; color: var(--warn); }

  .live { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--ink-faint); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(74,222,128,.6); animation: pulse 2.2s infinite; }
  .dot.stale { background: var(--neg); animation: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(74,222,128,.5); }
    70% { box-shadow: 0 0 0 7px rgba(74,222,128,0); }
    100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
  }

  /* ---------- panels ---------- */

  aside {
    background: var(--panel);
    overflow-y: auto;
    padding: 14px;
  }
  #side { grid-area: side; border-right: 1px solid var(--line); }
  #insp { grid-area: insp; border-left: 1px solid var(--line); }

  .sec { margin-bottom: 20px; }
  .sec > h3 {
    margin: 0 0 9px;
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
  }

  label.field { display: block; margin-bottom: 10px; }
  label.field > span { display: block; font-size: 11px; color: var(--ink-dim); margin-bottom: 4px; }

  input[type="text"], textarea, select {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    padding: 7px 9px;
    font: inherit;
    outline: none;
  }
  textarea { resize: vertical; min-height: 54px; }
  input[type="text"]:focus, textarea:focus, select:focus { border-color: #2f4a63; }

  input[type="range"] { width: 100%; accent-color: var(--pos); }

  .seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button {
    flex: 1;
    background: var(--panel-2);
    border: 0;
    color: var(--ink-dim);
    padding: 7px 4px;
    font: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  .seg button.on { background: #16222f; color: var(--accent); }
  .seg button + button { border-left: 1px solid var(--line); }

  .btn {
    width: 100%;
    background: #16222f;
    border: 1px solid #24384b;
    color: var(--accent);
    border-radius: 7px;
    padding: 8px;
    font: inherit;
    cursor: pointer;
  }
  .btn:hover { background: #1b2b3b; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .grouptoggles { display: flex; flex-wrap: wrap; gap: 6px; }
  .gt {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 8px 4px 6px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel-2);
    font-size: 11px;
    cursor: pointer;
    color: var(--ink-dim);
    user-select: none;
  }
  .gt.off { opacity: .35; }
  .gt i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; font-size: 12px; }
  .kv span:first-child { color: var(--ink-dim); }
  .kv span:last-child { color: var(--ink); }

  .bar { height: 4px; border-radius: 2px; background: #1a2330; overflow: hidden; margin-top: 3px; }
  .bar > i { display: block; height: 100%; background: var(--pos); }

  .factor { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; font-size: 12px; }
  .factor b { font-variant-numeric: tabular-nums; min-width: 44px; }
  .factor.pos b { color: var(--pos); }
  .factor.neg b { color: var(--neg); }
  .factor span { color: var(--ink-dim); }

  .muted { color: var(--ink-faint); font-size: 12px; }

  /* ---------- stage ---------- */

  #stage { grid-area: stage; position: relative; overflow: hidden; background:
      radial-gradient(1200px 700px at 45% 40%, #0d1420 0%, var(--bg) 70%); }
  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  svg.dragging { cursor: grabbing; }

  .edge { fill: none; pointer-events: none; }
  .edge.flow { stroke-dasharray: 5 10; animation: flow 1.1s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -15; } }

  .node { cursor: pointer; }
  .node circle, .node rect { transition: opacity .18s, filter .18s; }
  .nlabel { font-size: 9.5px; fill: var(--ink-faint); pointer-events: none; }
  svg:not(.labels) .nlabel.feat { display: none; }
  .nlabel.big { font-size: 11px; fill: var(--ink-dim); }
  .glabel { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; fill: var(--ink-faint); }
  .collabel { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; fill: #405066; }

  .dim { opacity: .07 !important; }
  .hot .nlabel { fill: var(--ink); }

  .stagehint {
    position: absolute; left: 14px; bottom: 12px;
    font-size: 11px; color: #3d4c5f; pointer-events: none;
  }
  .zoombar { position: absolute; right: 14px; bottom: 12px; display: flex; gap: 6px; }
  .zoombar button {
    width: 28px; height: 28px; border-radius: 6px;
    background: var(--panel); border: 1px solid var(--line);
    color: var(--ink-dim); cursor: pointer; font: inherit;
  }
  .zoombar button:hover { color: var(--ink); }

  .empty {
    position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%);
    padding: 12px 16px; color: var(--ink-faint); font-size: 12px;
    background: rgba(14, 19, 27, .92); border: 1px solid var(--line);
    border-radius: 9px; pointer-events: none; text-align: center;
  }
  .empty div { max-width: 460px; line-height: 1.65; }
  .empty code { color: var(--accent); }

  .scorebox { text-align: center; }
  .scorebox .n { font-size: 30px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .scorebox .u { font-size: 11px; color: var(--ink-faint); }

  @media (max-width: 1200px) {
    #app { grid-template-columns: 240px 1fr; grid-template-areas: "head head" "side stage"; }
    #insp { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">MONEYPRINTER <span>BRAIN</span></div>
    <div class="chips" id="chips"></div>
    <div class="live"><span class="dot" id="livedot"></span><span id="livetxt">conectando…</span></div>
  </header>

  <aside id="side">
    <div class="sec">
      <h3>Canal</h3>
      <select id="account"></select>
    </div>

    <div class="sec">
      <h3>Probar un tema</h3>
      <label class="field">
        <span>Tema / título</span>
        <input type="text" id="topic" placeholder="El secreto de Oumuamua que nadie explicó" autocomplete="off">
      </label>
      <label class="field">
        <span>Hook (opcional)</span>
        <input type="text" id="hook" placeholder="¿Y si no era una roca?" autocomplete="off">
      </label>
      <label class="field">
        <span>Guion (opcional)</span>
        <textarea id="script" placeholder="Pega el guion para activar las 17 features de estructura…"></textarea>
      </label>
    </div>

    <div class="sec">
      <h3>Qué muestran las conexiones</h3>
      <div class="seg" id="modeseg">
        <button data-mode="weights" class="on">Pesos aprendidos</button>
        <button data-mode="contrib">Este candidato</button>
      </div>
      <div class="muted" style="margin-top:7px" id="modehint"></div>
    </div>

    <div class="sec">
      <h3>Conexiones visibles <span class="mono" id="edgecount" style="color:var(--ink-faint)"></span></h3>
      <input type="range" id="density" min="5" max="100" value="45">
      <div class="muted">Las más fuertes primero.</div>
    </div>

    <div class="sec">
      <h3>Grupos de features</h3>
      <div class="grouptoggles" id="groups"></div>
    </div>

    <div class="sec" id="trainsec" hidden>
      <h3>Entrenar</h3>
      <button class="btn" id="trainbtn">Entrenar retador ahora</button>
      <div class="muted" style="margin-top:7px" id="trainout"></div>
    </div>

    <div class="sec">
      <h3>Datos</h3>
      <div id="datastats"></div>
    </div>
  </aside>

  <div id="stage">
    <svg id="svg"></svg>
    <div class="empty" id="empty" hidden></div>
    <div class="stagehint">arrastra para mover · rueda para zoom · clic en un nodo para fijarlo</div>
    <div class="zoombar">
      <button id="zin" title="Acercar">+</button>
      <button id="zout" title="Alejar">−</button>
      <button id="zfit" title="Ajustar">⤢</button>
    </div>
  </div>

  <aside id="insp"><div id="inspbody"></div></aside>
</div>

<script>
"use strict";

/* ============================================================ constants */

const GROUPS = ["text", "script", "plan", "temporal", "channel", "novelty", "thumbnail"];
const GROUP_LABEL = {
  text: "texto", script: "guion", plan: "plan", temporal: "tiempo",
  channel: "canal", novelty: "novedad", thumbnail: "miniatura",
};
const GROUP_COLOR = {
  text: "#a78bfa", script: "#34d399", plan: "#fbbf24", temporal: "#f472b6",
  channel: "#60a5fa", novelty: "#a3e635", thumbnail: "#f87171",
};
const TARGET_LABEL = {
  normalized_views: "views ×mediana",
  retention: "retención",
  watch_minutes: "minutos vistos",
  like_rate: "tasa de likes",
  comment_rate: "tasa comentarios",
  ctr: "CTR",
  subscriber_rate: "conversión a subs",
};
const BLEND_LABEL = {
  neural: "modelo", heuristic: "reglas Brain",
  rules: "RetentionLab", novelty: "novedad",
};

const POS = "#22d3ee", NEG = "#fb923c";
const NS = "http://www.w3.org/2000/svg";

/* layout geometry */
const COL_FEATURE = 300;
const COL_MID = 770;
const COL_BLEND = 1030;
const COL_SCORE = 1195;
const ROW_H = 11;
const GROUP_GAP = 20;
const TOP = 40;
const LABEL_EXTENT = 100;   /* how far feature labels reach left of the column */
const LABEL_ZOOM = 0.72;    /* below this scale, feature names are hidden */

/* ============================================================ state */

let state = null;          // /api/state
let scored = null;         // /api/score
let view = "weights";      // weights | contrib
let density = 45;          // % of edges shown
let hidden = new Set();    // hidden feature groups
let focus = null;          // hovered/pinned node id
let pinned = null;
let nodes = [], edges = [];
let lastSignature = "";

const el = (id) => document.getElementById(id);
const svg = el("svg");

/* ============================================================ fetching */

async function getState() {
  const account = el("account").value || "";
  const res = await fetch(`/api/state?account=${encodeURIComponent(account)}`);
  if (!res.ok) throw new Error("state " + res.status);
  return res.json();
}

async function postScore() {
  const topic = el("topic").value.trim();
  if (!topic) { scored = null; return; }
  const res = await fetch("/api/score", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      account_id: el("account").value || "",
      topic,
      hook: el("hook").value.trim(),
      script: el("script").value.trim(),
    }),
  });
  scored = res.ok ? await res.json() : null;
}

/* ============================================================ layout */

function buildGraph() {
  nodes = [];
  edges = [];
  if (!state) return;

  const featureNodes = [];
  let y = TOP;
  let lastGroup = null;

  for (const f of state.features) {
    if (hidden.has(f.group)) continue;
    if (lastGroup !== null && f.group !== lastGroup) y += GROUP_GAP;
    if (f.group !== lastGroup) {
      nodes.push({
        id: "g:" + f.group, kind: "grouplabel", label: GROUP_LABEL[f.group] || f.group,
        x: COL_FEATURE, y: y - 12, color: GROUP_COLOR[f.group],
      });
    }
    lastGroup = f.group;
    const n = {
      id: "f:" + f.name, kind: "feature", name: f.name, group: f.group,
      label: f.name, desc: f.description, x: COL_FEATURE, y,
      color: GROUP_COLOR[f.group] || "#7c8ba1",
    };
    nodes.push(n);
    featureNodes.push(n);
    y += ROW_H;
  }
  const featureBottom = y;

  /* heads (learned) in the upper middle column */
  const heads = state.heads || [];
  const headBlock = heads.length * 40;
  let hy = TOP + Math.max(0, (featureBottom - TOP) * 0.26 - headBlock / 2);
  const headNodes = [];
  if (heads.length) {
    nodes.push({ id: "c:heads", kind: "collabel", label: "cabezas del modelo",
                 x: COL_MID, y: hy - 26 });
  }
  for (const h of heads) {
    const n = {
      id: "h:" + h.target, kind: "head", target: h.target,
      label: TARGET_LABEL[h.target] || h.target, meta: h,
      x: COL_MID, y: hy, color: "#22d3ee",
    };
    nodes.push(n); headNodes.push(n);
    hy += 40;
  }

  /* rules (always present) in the lower middle column */
  const usable = new Set(featureNodes.map((n) => n.name));
  const rules = (state.rules || []).filter(
    (r) => r.inputs.every((i) => usable.has(i))
  );
  const ruleBlock = rules.length * 17;
  let ry = TOP + Math.max(0, (featureBottom - TOP) * 0.68 - ruleBlock / 2);
  if (heads.length && ry < hy + 50) ry = hy + 50;
  if (rules.length) {
    nodes.push({ id: "c:rules", kind: "collabel", label: "reglas en frío",
                 x: COL_MID, y: ry - 22 });
  }
  const ruleNodes = [];
  for (const r of rules) {
    const n = {
      id: "r:" + r.name, kind: "rule", name: r.name, label: r.name,
      inputs: r.inputs, detail: r.detail, negative_detail: r.negative_detail,
      x: COL_MID, y: ry, color: "#94a3b8",
    };
    nodes.push(n); ruleNodes.push(n);
    ry += 17;
  }

  /* blend components */
  const comps = ["neural", "heuristic", "rules", "novelty"].filter((c) => {
    if (c === "neural") return heads.length > 0;
    return true;
  });
  const midY = (TOP + featureBottom) / 2;
  let by = midY - (comps.length - 1) * 34 / 2;
  nodes.push({ id: "c:blend", kind: "collabel", label: "mezcla",
               x: COL_BLEND, y: by - 30 });
  const blendNodes = [];
  for (const c of comps) {
    const n = {
      id: "b:" + c, kind: "blend", key: c, label: BLEND_LABEL[c] || c,
      weight: (state.hybrid_weights || {})[c] || 0,
      x: COL_BLEND, y: by, color: "#7dd3fc",
    };
    nodes.push(n); blendNodes.push(n);
    by += 34;
  }

  const scoreNode = {
    id: "s:score", kind: "score", label: "BRAIN SCORE",
    x: COL_SCORE, y: midY, color: "#e6edf6",
  };
  nodes.push(scoreNode);

  /* ---- edges ---- */
  const byName = new Map(featureNodes.map((n) => [n.name, n]));

  for (const h of headNodes) {
    const w = (state.weights || {})[h.target] || {};
    const contrib = scored ? (scored.contributions || {})[h.target] || {} : {};
    for (const [name, weight] of Object.entries(w)) {
      const from = byName.get(name);
      if (!from) continue;
      edges.push({
        kind: "fh", from, to: h,
        weight, contrib: contrib[name] || 0,
      });
    }
  }

  for (const r of ruleNodes) {
    const from = byName.get(r.inputs[0]);
    if (!from) continue;
    const fired = scored
      ? (scored.rules_fired || []).find((f) => f.name === r.name)
      : null;
    edges.push({
      kind: "fr", from, to: r,
      weight: 0.55, contrib: fired ? fired.points : 0,
      inactive: !!scored && !fired,
    });
  }

  const blendByKey = new Map(blendNodes.map((n) => [n.key, n]));
  for (const h of headNodes) {
    const b = blendByKey.get("neural");
    if (b) edges.push({ kind: "hb", from: h, to: b,
                        weight: (state.reward_weights || {})[h.target] || 0.1,
                        contrib: (state.reward_weights || {})[h.target] || 0.1 });
  }
  for (const r of ruleNodes) {
    const b = blendByKey.get("heuristic");
    const fired = scored
      ? (scored.rules_fired || []).find((f) => f.name === r.name)
      : null;
    if (b) edges.push({ kind: "rb", from: r, to: b, weight: 0.25,
                        contrib: fired ? fired.points : 0,
                        inactive: !!scored && !fired });
  }
  for (const b of blendNodes) {
    edges.push({ kind: "bs", from: b, to: scoreNode,
                 weight: b.weight, contrib: b.weight });
  }

  return featureBottom;
}

/* ============================================================ rendering */

function edgeMetric(e) {
  return view === "contrib" && scored ? Math.abs(e.contrib) : Math.abs(e.weight);
}

function visibleEdges() {
  const scored_ = edges.filter((e) => e.kind === "fh");
  if (!scored_.length) return edges;
  const sorted = [...scored_].sort((a, b) => edgeMetric(b) - edgeMetric(a));
  const keep = Math.max(1, Math.round(sorted.length * density / 100));
  const allow = new Set(sorted.slice(0, keep));
  return edges.filter((e) => e.kind !== "fh" || allow.has(e));
}

function curve(e) {
  const dx = (e.to.x - e.from.x) * 0.45;
  return `M ${e.from.x} ${e.from.y} C ${e.from.x + dx} ${e.from.y}, ` +
         `${e.to.x - dx} ${e.to.y}, ${e.to.x} ${e.to.y}`;
}

function makeEl(tag, attrs, parent) {
  const node = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
}

let gRoot, gEdges, gNodes;

function render() {
  svg.innerHTML = "";
  const bottom = buildGraph() || 600;

  gRoot = makeEl("g", { id: "root" }, svg);
  gEdges = makeEl("g", {}, gRoot);
  gNodes = makeEl("g", {}, gRoot);

  const shown = visibleEdges();
  const maxMetric = Math.max(1e-9, ...shown.map(edgeMetric));

  for (const e of shown) {
    const m = edgeMetric(e);
    const rel = m / maxMetric;
    const value = view === "contrib" && scored ? e.contrib : e.weight;
    const color = value >= 0 ? POS : NEG;
    const active = view === "contrib" && scored && Math.abs(e.contrib) > 1e-9;
    const path = makeEl("path", {
      class: "edge" + (active ? " flow" : ""),
      d: curve(e),
      stroke: e.inactive ? "#243040" : color,
      "stroke-width": (0.35 + rel * 2.6).toFixed(2),
      "stroke-opacity": e.inactive ? 0.10 : (0.12 + rel * 0.62).toFixed(3),
      "stroke-linecap": "round",
    }, gEdges);
    e._el = path;
  }

  for (const n of nodes) drawNode(n);

  applyFocus();
  el("edgecount").textContent = `${shown.filter((e) => e.kind === "fh").length} / ${edges.filter((e) => e.kind === "fh").length}`;
  fit(bottom);
}

function drawNode(n) {
  if (n.kind === "grouplabel") {
    const t = makeEl("text", {
      class: "glabel", x: n.x - 22, y: n.y, "text-anchor": "end", fill: n.color,
    }, gNodes);
    t.textContent = n.label;
    return;
  }
  if (n.kind === "collabel") {
    const t = makeEl("text", { class: "collabel", x: n.x, y: n.y,
                               "text-anchor": "middle" }, gNodes);
    t.textContent = n.label;
    return;
  }

  const g = makeEl("g", { class: "node", "data-id": n.id }, gNodes);
  n._el = g;

  if (n.kind === "feature") {
    const act = scored ? scored.activations[n.name] : null;
    const heat = act && !act.missing ? Math.min(1, Math.abs(act.standardized) / 2.5) : 0;
    if (heat > 0.02) {
      makeEl("circle", {
        cx: n.x, cy: n.y, r: 4 + heat * 7, fill: n.color,
        opacity: (heat * 0.28).toFixed(3),
      }, g);
    }
    makeEl("circle", {
      cx: n.x, cy: n.y, r: 3.4, fill: act && act.missing ? "#1b2431" : n.color,
      stroke: n.color, "stroke-width": act && act.missing ? 1 : 0,
      "stroke-opacity": 0.5,
    }, g);
    const t = makeEl("text", { class: "nlabel feat", x: n.x - 10, y: n.y + 3,
                               "text-anchor": "end" }, g);
    t.textContent = n.label;
  } else if (n.kind === "head") {
    const conf = n.meta.confidence || 0;
    makeEl("rect", {
      x: n.x - 78, y: n.y - 13, width: 156, height: 26, rx: 6,
      fill: "#0f1c26", stroke: "#1d3f4f", "stroke-width": 1,
    }, g);
    makeEl("rect", {
      x: n.x - 78, y: n.y + 9, width: 156 * conf, height: 3, rx: 1.5,
      fill: POS, opacity: 0.7,
    }, g);
    const t = makeEl("text", { class: "nlabel big", x: n.x, y: n.y - 1,
                               "text-anchor": "middle", fill: "#cfe9f2" }, g);
    t.textContent = n.label;
    if (scored && scored.targets && scored.targets[n.target] != null) {
      const v = makeEl("text", { class: "nlabel", x: n.x + 72, y: n.y - 1,
                                 "text-anchor": "end", fill: POS }, g);
      v.textContent = fmt(scored.targets[n.target]);
    }
  } else if (n.kind === "rule") {
    const fired = scored
      ? (scored.rules_fired || []).find((f) => f.name === n.name) : null;
    makeEl("circle", {
      cx: n.x, cy: n.y, r: fired ? 4.5 : 3,
      fill: fired ? (fired.points >= 0 ? POS : NEG) : "#2a3646",
      opacity: fired ? 0.9 : 0.75,
    }, g);
    const t = makeEl("text", { class: "nlabel", x: n.x + 11, y: n.y + 3 }, g);
    t.textContent = n.label;
  } else if (n.kind === "blend") {
    const val = scored && scored.components ? scored.components[n.key] : null;
    makeEl("rect", {
      x: n.x - 62, y: n.y - 12, width: 124, height: 24, rx: 6,
      fill: "#101d29", stroke: "#22384a",
    }, g);
    const t = makeEl("text", { class: "nlabel big", x: n.x - 54, y: n.y + 4,
                               fill: "#bcd9e8" }, g);
    t.textContent = n.label;
    const v = makeEl("text", { class: "nlabel", x: n.x + 54, y: n.y + 4,
                               "text-anchor": "end",
                               fill: val == null ? "#48606f" : POS }, g);
    v.textContent = val == null ? `×${n.weight.toFixed(2)}` : val.toFixed(1);
  } else if (n.kind === "score") {
    makeEl("circle", {
      cx: n.x, cy: n.y, r: 44, fill: "#0d1a22", stroke: "#1f4354", "stroke-width": 1.5,
    }, g);
    if (scored) {
      makeEl("circle", {
        cx: n.x, cy: n.y, r: 44, fill: "none", stroke: POS, "stroke-width": 3,
        "stroke-dasharray": `${(scored.score / 10) * 276} 276`,
        transform: `rotate(-90 ${n.x} ${n.y})`, "stroke-linecap": "round",
        opacity: 0.85,
      }, g);
    }
    const t = makeEl("text", {
      x: n.x, y: n.y + 6, "text-anchor": "middle",
      fill: scored ? "#e6edf6" : "#3f5464",
      style: "font-size:24px;font-weight:650;font-variant-numeric:tabular-nums",
    }, g);
    t.textContent = scored ? scored.score.toFixed(2) : "—";
    const c = makeEl("text", { class: "nlabel", x: n.x, y: n.y + 62,
                               "text-anchor": "middle" }, g);
    c.textContent = scored ? `confianza ${(scored.confidence * 100).toFixed(0)}%` : "escribe un tema";
  }

  g.addEventListener("mouseenter", () => { if (!pinned) { focus = n.id; applyFocus(); inspect(n); } });
  g.addEventListener("mouseleave", () => { if (!pinned) { focus = null; applyFocus(); inspect(null); } });
  g.addEventListener("click", (ev) => {
    ev.stopPropagation();
    pinned = pinned === n.id ? null : n.id;
    focus = pinned || null;
    applyFocus(); inspect(pinned ? n : null);
  });
}

function applyFocus() {
  const id = focus;
  const touched = new Set();
  if (id) {
    touched.add(id);
    for (const e of edges) {
      if (!e._el) continue;
      if (e.from.id === id || e.to.id === id) {
        touched.add(e.from.id); touched.add(e.to.id);
      }
    }
  }
  for (const e of edges) {
    if (!e._el) continue;
    const on = !id || e.from.id === id || e.to.id === id;
    e._el.classList.toggle("dim", !on);
  }
  for (const n of nodes) {
    if (!n._el) continue;
    const on = !id || touched.has(n.id);
    n._el.classList.toggle("dim", !on);
    n._el.classList.toggle("hot", !!id && n.id === id);
  }
}

/* ============================================================ zoom / pan */

let tx = 0, ty = 0, scale = 1;

function applyTransform() {
  if (gRoot) gRoot.setAttribute("transform", `translate(${tx} ${ty}) scale(${scale})`);
  svg.classList.toggle("labels", scale >= LABEL_ZOOM);
}

function fit(bottom) {
  const box = svg.getBoundingClientRect();
  const minX = COL_FEATURE - LABEL_EXTENT;
  const maxX = COL_SCORE + 80;
  const minY = 0;
  const maxY = (bottom || 800) + 70;
  const w = maxX - minX, h = maxY - minY;
  const pad = 24;
  scale = Math.min((box.width - pad * 2) / w, (box.height - pad * 2) / h, 1.6);
  tx = pad + (box.width - pad * 2 - w * scale) / 2 - minX * scale;
  ty = pad + (box.height - pad * 2 - h * scale) / 2 - minY * scale;
  applyTransform();
}

svg.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const box = svg.getBoundingClientRect();
  const mx = ev.clientX - box.left, my = ev.clientY - box.top;
  const k = Math.exp(-ev.deltaY * 0.0016);
  const next = Math.max(0.15, Math.min(4, scale * k));
  tx = mx - (mx - tx) * (next / scale);
  ty = my - (my - ty) * (next / scale);
  scale = next;
  applyTransform();
}, { passive: false });

let dragging = false, sx = 0, sy = 0;
svg.addEventListener("pointerdown", (ev) => {
  dragging = true; sx = ev.clientX - tx; sy = ev.clientY - ty;
  svg.classList.add("dragging"); svg.setPointerCapture(ev.pointerId);
});
svg.addEventListener("pointermove", (ev) => {
  if (!dragging) return;
  tx = ev.clientX - sx; ty = ev.clientY - sy; applyTransform();
});
svg.addEventListener("pointerup", (ev) => {
  dragging = false; svg.classList.remove("dragging");
  try { svg.releasePointerCapture(ev.pointerId); } catch (e) {}
});
svg.addEventListener("click", () => { pinned = null; focus = null; applyFocus(); inspect(null); });

el("zin").onclick = () => { scale = Math.min(4, scale * 1.25); applyTransform(); };
el("zout").onclick = () => { scale = Math.max(0.15, scale / 1.25); applyTransform(); };
el("zfit").onclick = () => render();

/* ============================================================ inspector */

function fmt(v) {
  if (v == null) return "—";
  const a = Math.abs(v);
  if (a >= 1000) return v.toFixed(0);
  if (a >= 10) return v.toFixed(1);
  if (a >= 1) return v.toFixed(2);
  return v.toFixed(3);
}

function inspect(n) {
  const box = el("inspbody");
  if (!n) { box.innerHTML = defaultInspector(); return; }

  if (n.kind === "feature") {
    const act = scored ? scored.activations[n.name] : null;
    const rows = [];
    for (const [target, w] of Object.entries(state.weights || {})) {
      if (w[n.name] == null) continue;
      const c = scored ? (scored.contributions[target] || {})[n.name] : null;
      rows.push(`<div class="kv"><span>${TARGET_LABEL[target] || target}</span>
        <span class="mono" style="color:${w[n.name] >= 0 ? POS : NEG}">
        ${w[n.name] >= 0 ? "+" : ""}${w[n.name].toFixed(4)}${c != null ? ` · c ${c >= 0 ? "+" : ""}${c.toFixed(3)}` : ""}</span></div>`);
    }
    box.innerHTML = `
      <div class="sec">
        <h3>Feature</h3>
        <div class="mono" style="color:${n.color};font-size:13px">${n.name}</div>
        <div class="muted" style="margin-top:5px">${n.desc || ""}</div>
      </div>
      <div class="sec">
        <h3>Valor en este candidato</h3>
        ${act ? `
          <div class="kv"><span>valor</span><span class="mono">${fmt(act.value)}</span></div>
          <div class="kv"><span>estandarizado</span><span class="mono">${fmt(act.standardized)}σ</span></div>
          <div class="kv"><span>medido</span><span>${act.missing ? "no — imputado a la media" : "sí"}</span></div>
        ` : `<div class="muted">Escribe un tema para ver su activación.</div>`}
      </div>
      <div class="sec">
        <h3>Pesos por cabeza</h3>
        ${rows.length ? rows.join("") : `<div class="muted">Sin modelo entrenado todavía.</div>`}
      </div>`;
    return;
  }

  if (n.kind === "head") {
    const m = n.meta;
    box.innerHTML = `
      <div class="sec">
        <h3>Cabeza del modelo</h3>
        <div style="font-size:14px">${n.label}</div>
        <div class="mono muted">${n.target}</div>
      </div>
      <div class="sec">
        <h3>Ajuste</h3>
        <div class="kv"><span>filas de entrenamiento</span><span class="mono">${m.n_samples}</span></div>
        <div class="kv"><span>alpha (ridge)</span><span class="mono">${m.alpha}</span></div>
        <div class="kv"><span>R² validación</span><span class="mono">${fmt(m.r2)}</span></div>
        <div class="kv"><span>RMSE</span><span class="mono">${fmt(m.rmse)}</span></div>
        <div class="kv"><span>confianza</span><span class="mono">${(m.confidence * 100).toFixed(0)}%</span></div>
        <div class="bar"><i style="width:${(m.confidence * 100).toFixed(0)}%"></i></div>
      </div>
      ${scored && scored.targets[n.target] != null ? `
      <div class="sec"><h3>Predicción</h3>
        <div class="scorebox"><div class="n" style="color:${POS}">${fmt(scored.targets[n.target])}</div>
        <div class="u">${n.target === "normalized_views" ? "× la mediana del canal" : ""}</div></div>
      </div>` : ""}
      <div class="sec">
        <h3>Top conexiones</h3>
        ${topEdgesFor(n)}
      </div>`;
    return;
  }

  if (n.kind === "rule") {
    const fired = scored
      ? (scored.rules_fired || []).find((f) => f.name === n.name) : null;
    box.innerHTML = `
      <div class="sec">
        <h3>Regla en frío</h3>
        <div class="mono" style="font-size:13px">${n.name}</div>
        <div class="muted" style="margin-top:6px">Lee: <span class="mono">${n.inputs.join(", ")}</span></div>
      </div>
      <div class="sec">
        <h3>Qué dice</h3>
        <div class="factor pos"><b>+</b><span>${n.detail}</span></div>
        ${n.negative_detail ? `<div class="factor neg"><b>−</b><span>${n.negative_detail}</span></div>` : ""}
      </div>
      <div class="sec">
        <h3>En este candidato</h3>
        ${fired
          ? `<div class="factor ${fired.points >= 0 ? "pos" : "neg"}"><b>${fired.points >= 0 ? "+" : ""}${fired.points.toFixed(2)}</b><span>${fired.detail}</span></div>`
          : `<div class="muted">${scored ? "No se activó (su feature no se pudo medir, o el valor es neutro)." : "Escribe un tema."}</div>`}
      </div>`;
    return;
  }

  if (n.kind === "blend") {
    const val = scored && scored.components ? scored.components[n.key] : null;
    box.innerHTML = `
      <div class="sec">
        <h3>Componente de la mezcla</h3>
        <div style="font-size:14px">${n.label}</div>
      </div>
      <div class="sec">
        <div class="kv"><span>peso configurado</span><span class="mono">${n.weight.toFixed(2)}</span></div>
        <div class="kv"><span>valor ahora</span><span class="mono">${val == null ? "—" : val.toFixed(2)}</span></div>
        <div class="muted" style="margin-top:8px">
          Los componentes que no se pueden calcular desaparecen y los pesos
          restantes se renormalizan.
        </div>
      </div>`;
    return;
  }

  if (n.kind === "score") { box.innerHTML = defaultInspector(); }
}

function topEdgesFor(head) {
  const list = edges
    .filter((e) => e.to.id === head.id)
    .sort((a, b) => edgeMetric(b) - edgeMetric(a))
    .slice(0, 10);
  if (!list.length) return `<div class="muted">Sin conexiones.</div>`;
  return list.map((e) => {
    const v = view === "contrib" && scored ? e.contrib : e.weight;
    return `<div class="kv"><span class="mono" style="font-size:11px">${e.from.label}</span>
      <span class="mono" style="color:${v >= 0 ? POS : NEG}">${v >= 0 ? "+" : ""}${v.toFixed(4)}</span></div>`;
  }).join("");
}

function defaultInspector() {
  if (!state) return `<div class="muted">Cargando…</div>`;
  if (!scored) {
    return `
      <div class="sec">
        <h3>Cómo leerlo</h3>
        <div class="muted" style="line-height:1.7">
          Cada punto de la izquierda es una feature; cada línea es un peso
          aprendido hacia una cabeza del modelo.
          <b style="color:${POS}">Cian</b> empuja hacia arriba,
          <b style="color:${NEG}">naranja</b> hacia abajo. El grosor es la magnitud.
          <br><br>
          Escribe un tema arriba y la red se enciende: verás el valor de cada
          feature, qué reglas disparan y cómo se arma el score.
        </div>
      </div>
      <div class="sec">
        <h3>Estado</h3>
        <div class="kv"><span>modelo</span><span class="mono">${state.model_version}</span></div>
        <div class="kv"><span>tier</span><span class="mono">${state.tier}</span></div>
        <div class="kv"><span>features</span><span class="mono">${state.features.length}</span></div>
        <div class="kv"><span>reglas</span><span class="mono">${state.rules.length}</span></div>
        <div class="kv"><span>decisiones</span><span class="mono">${state.decisions}</span></div>
      </div>`;
  }
  const why = scored.why || {};
  return `
    <div class="sec">
      <h3>Score</h3>
      <div class="scorebox">
        <div class="n">${scored.score.toFixed(2)}<span class="u"> / 10</span></div>
        <div class="u">confianza ${(scored.confidence * 100).toFixed(0)}% ·
          ${scored.should_decide ? "decidiría" : "se abstiene"}</div>
      </div>
      <div class="bar" style="margin-top:9px"><i style="width:${scored.score * 10}%"></i></div>
    </div>
    <div class="sec">
      <h3>A favor</h3>
      ${(why.positive || []).map((f) => `<div class="factor pos"><b>+${f.weight.toFixed(2)}</b><span>${f.factor}</span></div>`).join("") || `<div class="muted">—</div>`}
    </div>
    <div class="sec">
      <h3>En contra</h3>
      ${(why.negative || []).map((f) => `<div class="factor neg"><b>${f.weight.toFixed(2)}</b><span>${f.factor}</span></div>`).join("") || `<div class="muted">—</div>`}
    </div>
    <div class="sec">
      <h3>Cobertura</h3>
      <div class="kv"><span>features medidas</span><span class="mono">${(scored.coverage * 100).toFixed(0)}%</span></div>
      <div class="bar"><i style="width:${scored.coverage * 100}%"></i></div>
      <div class="muted" style="margin-top:7px">
        Lo no medido se imputa a la media de entrenamiento: no aporta nada,
        ni a favor ni en contra.
      </div>
    </div>`;
}

/* ============================================================ chrome */

function renderChrome() {
  const s = state;
  el("chips").innerHTML = [
    `<span class="chip">modelo <b class="mono">${s.model_version}</b></span>`,
    `<span class="chip">tier <b>${s.tier}</b></span>`,
    `<span class="chip ${s.mode === "shadow" ? "" : "warn"}">modo <b>${s.mode}</b></span>`,
    `<span class="chip">features <b>${s.features.length}</b></span>`,
    `<span class="chip">schema <b class="mono">${s.feature_schema}</b></span>`,
    s.heads.length
      ? `<span class="chip good">${s.heads.length} ${s.heads.length === 1
            ? "cabeza entrenada" : "cabezas entrenadas"}</span>`
      : `<span class="chip warn">sin modelo — solo reglas</span>`,
  ].join("");

  const d = s.dataset || {};
  el("datastats").innerHTML = `
    <div class="kv"><span>filas del dataset</span><span class="mono">${d.rows || 0}</span></div>
    <div class="kv"><span>maduras</span><span class="mono">${d.mature_rows || 0}</span></div>
    <div class="kv"><span>tuyas / referencia</span><span class="mono">${d.own_rows ?? d.rows ?? 0} / ${d.reference_rows || 0}</span></div>
    <div class="kv"><span>canales</span><span class="mono">${(s.channels || []).length}</span></div>
    <div class="kv"><span>decisiones</span><span class="mono">${s.decisions || 0}</span></div>
    <div class="kv"><span>versiones</span><span class="mono">${(s.registry.versions || []).join(", ") || "—"}</span></div>`;

  el("trainsec").hidden = !s.allow_train;

  const acc = el("account");
  if (acc.dataset.filled !== "1") {
    acc.innerHTML = (s.channels || [])
      .map((c) => `<option value="${c.account_id}">${c.nickname} · ${c.published} videos</option>`)
      .join("") || `<option value="">(sin canales)</option>`;
    acc.dataset.filled = "1";
  }

  if (!el("groups").dataset.filled) {
    el("groups").innerHTML = GROUPS.map((g) => {
      const n = s.features.filter((f) => f.group === g).length;
      return `<div class="gt" data-g="${g}"><i style="background:${GROUP_COLOR[g]}"></i>${GROUP_LABEL[g]} ${n}</div>`;
    }).join("");
    el("groups").dataset.filled = "1";
    for (const node of el("groups").children) {
      node.onclick = () => {
        const g = node.dataset.g;
        if (hidden.has(g)) hidden.delete(g); else hidden.add(g);
        node.classList.toggle("off", hidden.has(g));
        render();
      };
    }
  }

  el("modehint").textContent = state.heads.length
    ? (view === "weights"
        ? "Grosor = magnitud del peso aprendido."
        : "Grosor = cuánto aporta esa feature a ESTE candidato.")
    : "Aún no hay modelo: las conexiones que ves son las reglas en frío.";

  const emptyBox = el("empty");
  if (!s.heads.length && (d.mature_rows || 0) < 40) {
    emptyBox.hidden = false;
    emptyBox.innerHTML = `<div>
      Todavía no hay modelo entrenado, así que lo que ves es la capa de reglas:
      cada regla lee una feature y aporta puntos.<br><br>
      Para ver la red completa con pesos aprendidos:
      <code>python scripts/brain_viz.py --demo</code></div>`;
  } else {
    emptyBox.hidden = true;
  }
}

/* ============================================================ loop */

let debounce = null;

async function refreshScore() {
  await postScore();
  render();
  inspect(pinned ? nodes.find((n) => n.id === pinned) : null);
}

function onInput() {
  clearTimeout(debounce);
  debounce = setTimeout(refreshScore, 280);
}

for (const id of ["topic", "hook", "script"]) el(id).addEventListener("input", onInput);

for (const b of el("modeseg").children) {
  b.onclick = () => {
    for (const other of el("modeseg").children) other.classList.remove("on");
    b.classList.add("on");
    view = b.dataset.mode;
    renderChrome();
    render();
  };
}

el("density").addEventListener("input", (ev) => {
  density = +ev.target.value;
  render();
});

el("account").addEventListener("change", async () => {
  state = await getState();
  await refreshScore();
});

el("trainbtn").onclick = async () => {
  const btn = el("trainbtn");
  btn.disabled = true; btn.textContent = "Entrenando…";
  try {
    const res = await fetch("/api/train", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ account_id: el("account").value || "" }),
    });
    const out = await res.json();
    el("trainout").textContent = out.trained
      ? `${out.version} · promovido: ${out.promoted ? "sí" : "no"} · ${(out.targets || []).length} cabezas`
      : (out.reason || out.error || "no entrenado");
    state = await getState();
    renderChrome();
    await refreshScore();
  } catch (e) {
    el("trainout").textContent = String(e);
  } finally {
    btn.disabled = false; btn.textContent = "Entrenar retador ahora";
  }
};

async function poll() {
  try {
    const next = await getState();
    const sig = [next.model_version, next.feature_schema, next.tier,
                 (next.dataset || {}).rows, next.decisions,
                 (next.registry || {}).champion].join("|");
    const first = !state;
    state = next;
    el("livedot").classList.remove("stale");
    el("livetxt").textContent = "en vivo · " +
      new Date(next.generated_at).toLocaleTimeString();
    if (first || sig !== lastSignature) {
      lastSignature = sig;
      renderChrome();
      if (el("topic").value.trim()) await postScore();
      render();
      if (!pinned) inspect(null);
    } else {
      renderChrome();
    }
  } catch (e) {
    el("livedot").classList.add("stale");
    el("livetxt").textContent = "sin conexión";
  }
}

window.addEventListener("resize", () => render());

poll();
setInterval(poll, 2500);
</script>
